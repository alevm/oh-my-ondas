; Oh My Ondas - ESP32-S2 bridge (Teensy Serial7 <-> WiFi <-> wss server)
; Separate PlatformIO project: the parent firmware/platformio.ini has
; src_dir = teensy, which cannot be overridden per environment.
;
; Build:   cd firmware/esp32 && pio run
; Flash:   cd firmware/esp32 && pio run -t upload
; Logs:    cd firmware/esp32 && pio device monitor
;
; Needs config.h next to this file (copy config.example.h; config.h is gitignored).

[platformio]
default_envs = esp32s2

[env:esp32s2]
platform = espressif32@7.0.1
board = sparkfun_esp32s2_thing_plus
framework = arduino

build_flags =
    -I$PROJECT_DIR            ; config.h
    -I$PROJECT_DIR/../common  ; link_protocol.h
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Serial = native USB CDC (logs), Serial1 = Teensy link
    -D CORE_DEBUG_LEVEL=1         ; errors only
    -D WEBSOCKETS_TCP_TIMEOUT=4000  ; bound TCP connect + handshake reply wait (lib default 5000)
    -Wall -Wextra

lib_deps =
    links2004/WebSockets@2.6.1

monitor_speed = 115200
monitor_filters = time
