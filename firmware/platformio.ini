; Oh My Ondas - PlatformIO Configuration
; Build with: pio run
; Upload with: pio run --target upload

[platformio]
default_envs = teensy41
src_dir = teensy
include_dir = teensy/include
lib_dir = teensy/lib   ; vendored libraries (SI4735 patched for Wire2)

; ============================================
; Teensy 4.1 - Main Processor
; ============================================
[env:teensy41]
platform = platformio/teensy
board = teensy41
framework = arduino

; Exclude stale directories and test suite
build_src_filter = +<*> -<main/> -<test/> -<lib/> -<demo/>

; Build flags
;   USB_MIDI_AUDIO_SERIAL: USB MIDI + USB audio + serial monitor
;   -I common: link_protocol.h shared with the ESP32-S2 firmware
build_flags =
    -D AUDIO_BLOCK_SAMPLES=128
    -D USB_MIDI_AUDIO_SERIAL
    -D F_CPU=600000000
    -D DEBUG=1
    -O2
    -I common

; Serial monitor
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Libraries
lib_deps =
    ; Audio
    Audio
    Wire
    SPI
    SD
    SerialFlash

    ; Touch sensor
    adafruit/Adafruit CAP1188 Library@^1.1.3

    ; Displays
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.1

    ; Encoders (2 I2C Quad Rotary Encoder boards)
    adafruit/Adafruit seesaw Library@^1.7.9

    ; GPS (PA1010D on I2C)
    adafruit/Adafruit GPS Library@^1.7.5

    ; JSON for settings
    bblanchon/ArduinoJson@^6.21.4

; Upload settings
upload_protocol = custom
upload_command = teensy_loader_cli -mmcu=TEENSY41 -v $SOURCE

; ============================================
; Teensy 4.1 - Hardware Test Suite
; To build the test sketch:
;   mv teensy/main.ino teensy/main.ino.bak
;   cp teensy/test/test_hardware.ino teensy/main.ino
;   pio run -e teensy41_test
;   # Restore after:
;   mv teensy/main.ino.bak teensy/main.ino
; ============================================
[env:teensy41_test]
platform = platformio/teensy
board = teensy41
framework = arduino

; Build only the test sketch — swap it in as main.ino first (see above)
build_src_filter = +<*> -<main/> -<test/> -<lib/> -<demo/> -<sampling_engine.cpp> -<sequencer.cpp> -<fx_engine.cpp> -<synth_voice.cpp> -<scene_manager.cpp> -<audio_recorder.cpp> -<input_manager.cpp> -<lcd_display.cpp> -<map_display.cpp> -<radio.cpp> -<midi_io.cpp> -<audio_sense.cpp> -<feature_extractor.cpp> -<capture_store.cpp> -<play_capture.cpp> -<continuous_mapper.cpp> -<plan_renderer.cpp> -<esp_link.cpp> -<motion_sensors.cpp>

build_flags =
    -D AUDIO_BLOCK_SAMPLES=128
    -D USB_AUDIO_SERIAL
    -D F_CPU=600000000
    -D DEBUG=1
    -O2

monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Exactly what test/test_hardware.ino #includes. That sketch is still the
; v0.3 suite (direct-pin encoders, NeoPixel ring, CAP1188 on Wire1): Encoder
; and NeoPixel stay only for it (it does not match the v1 hardware). The
; per-layer v1 tests are in test/layer*/.
lib_deps =
    Audio
    Wire
    SPI
    SD
    SerialFlash
    adafruit/Adafruit CAP1188 Library@^1.1.3
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    paulstoffregen/Encoder@^1.4.4
    adafruit/Adafruit NeoPixel@^1.12.0

upload_protocol = custom
upload_command = teensy_loader_cli -mmcu=TEENSY41 -v $SOURCE

; ============================================
; ESP32-S2 bridge (SparkFun ESP32-S2 Thing Plus)
; Separate PlatformIO project, because src_dir above is global:
;   firmware/esp32/platformio.ini  ->  cd esp32 && pio run
; ============================================

; ============================================
; Common Settings
; ============================================
[env]
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,readability-*,bugprone-*

; Build type
build_type = release
