; Oh My Ondas - PlatformIO Configuration
; Build with: pio run
; Upload with: pio run --target upload

[platformio]
default_envs = teensy41
src_dir = teensy
include_dir = teensy/include
lib_dir = teensy/lib   ; vendored libraries (SI4735 patched for Wire2)
test_dir = teensy/test/native   ; host unit tests (pio test -e native)

; ============================================
; Teensy 4.1 - Main Processor
; ============================================
[env:teensy41]
platform = platformio/teensy
board = teensy41
framework = arduino

; Exclude stale directories and test suite
build_src_filter = +<*> -<main/> -<test/> -<lib/> -<demo/>

; Build flags
;   USB_MIDI_AUDIO_SERIAL: USB MIDI + USB audio + serial monitor
;   -I common: link_protocol.h shared with the ESP32-S2 firmware
build_flags =
    -D AUDIO_BLOCK_SAMPLES=128
    -D USB_MIDI_AUDIO_SERIAL
    -D F_CPU=600000000
    -D DEBUG=1
    -O2
    -I common

; Serial monitor
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Libraries
lib_deps =
    ; Audio
    Audio
    Wire
    SPI
    SD
    SerialFlash

    ; Touch sensor
    adafruit/Adafruit CAP1188 Library@^1.1.3

    ; Displays
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.1

    ; Encoders (2 I2C Quad Rotary Encoder boards)
    adafruit/Adafruit seesaw Library@^1.7.9

    ; GPS (PA1010D on I2C)
    adafruit/Adafruit GPS Library@^1.7.5

    ; JSON for settings
    bblanchon/ArduinoJson@^6.21.4

; Upload settings
upload_protocol = custom
upload_command = teensy_loader_cli -mmcu=TEENSY41 -v $SOURCE

; ============================================
; Teensy 4.1 - Bench sketch (test/bench_all: every part live, LCD + sound)
; Build:   pio run -e bench
; Upload:  pio run -e bench -t upload
; Replaces teensy41_test, which built test/test_hardware.ino (the v0.3
; suite: direct-pin encoders, NeoPixel ring, CAP1188 on Wire1) and no
; longer compiled. The per-layer v1 tests in test/layer*/ open in the IDE.
; ============================================
[env:bench]
platform = platformio/teensy
board = teensy41
framework = arduino

; Source folder = teensy/test/bench_all (src_dir above is global, and .ino
; files are only converted at the top of the source folder)
extra_scripts = pre:teensy/test/bench_src_dir.py

; -I: demo_play reuses the firmware's capture player
build_flags =
    -I teensy/include
    -D AUDIO_BLOCK_SAMPLES=128
    -D USB_SERIAL
    -D F_CPU=600000000
    -O2

monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Exactly what test/bench_all/bench_all.ino #includes
lib_deps =
    Audio
    Wire
    SPI
    SD
    SerialFlash
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit CAP1188 Library@^1.1.3
    adafruit/Adafruit ADS1X15@^2.5.0

upload_protocol = custom
upload_command = teensy_loader_cli -mmcu=TEENSY41 -v $SOURCE

; ============================================
; Host unit tests: common/link_protocol.h (CRC-16, COBS, frame build/parse)
; Run: pio test -e native   (needs only a host C++ compiler)
; ============================================
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -I common -Wall -Wextra

; ============================================
; ESP32-S2 bridge (SparkFun ESP32-S2 Thing Plus)
; Separate PlatformIO project, because src_dir above is global:
;   firmware/esp32/platformio.ini  ->  cd esp32 && pio run
; ============================================

; ============================================
; Common Settings
; ============================================
[env]
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,readability-*,bugprone-*

; Build type
build_type = release
