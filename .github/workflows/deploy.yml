name: Deploy to Sisyphus

# Push to main -> signed call to the Sisyphus deploy-static webhook -> the VPS
# pulls main into /opt/sisyphus/sites/ohmyondas.levm.eu and Caddy serves web/.
# Secret DEPLOY_SECRET (= DEPLOY_SECRET_OHMYONDAS on the VPS) lives only in the
# "production" environment (main only, no reviewer: push deploys on its own).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "index.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Trigger deploy-static webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          PAYLOAD='{"branch": "main"}'
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" | awk '{print "sha256=" $NF}')
          CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 60 -X POST \
            "https://sisyphus.levm.eu/api/deploy-static/ohmyondas" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Signature: ${SIGNATURE}" \
            -d "$PAYLOAD")
          cat response.json; echo
          if [ "$CODE" != "200" ]; then
            echo "Deploy failed: HTTP $CODE"
            exit 1
          fi
          TAG=$(jq -r .tag response.json)
          if [ "${GITHUB_SHA:0:12}" != "$TAG" ]; then
            echo "Deployed $TAG but this run is ${GITHUB_SHA:0:12} (a newer push may have deployed first)"
          fi

      - name: Verify the live site
        run: |
          sleep 5
          CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "https://ohmyondas.levm.eu/")
          [ "$CODE" = "200" ] || { echo "ohmyondas.levm.eu returned $CODE"; exit 1; }
          curl -s --max-time 10 "https://ohmyondas.levm.eu/" | grep -o "Oh My Ondas v[^<]*" || true
