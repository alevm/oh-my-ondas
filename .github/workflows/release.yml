name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Teensy firmware
        working-directory: firmware
        run: pio run -e teensy41

      # Separate PlatformIO project; config.h is gitignored, so the release binary
      # carries the placeholder template (flash your own build for real WiFi/token).
      - name: Build ESP32-S2 firmware
        working-directory: firmware/esp32
        run: |
          cp config.example.h config.h
          pio run -e esp32s2

      - name: Package web app
        run: cd web && zip -r ../oh-my-ondas-web.zip . -x '*.gitkeep'

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            oh-my-ondas-web.zip \
            firmware/.pio/build/teensy41/firmware.hex \
            firmware/esp32/.pio/build/esp32s2/firmware.bin
