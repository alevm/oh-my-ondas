name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      # Same layout as production: web/ is the site root, the app is /app.html
      - name: Start local server
        run: |
          cd web && python3 -m http.server 8080 &
          sleep 2

      - name: Run E2E tests
        working-directory: tests
        env:
          TEST_URL: "http://localhost:8080"
          CI: "true"
        run: npm test

      - name: Run full button and generation validation
        if: success() || failure()
        working-directory: tests
        env:
          TEST_URL: "http://localhost:8080"
        run: npm run test:validate

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: |
            tests/test-screenshots/
            tests/screenshots/validation/
          retention-days: 7

  server:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install server dependencies
        run: pip install -r server/requirements-dev.txt

      # YAMNet model and real recordings are not in git. Without them the privacy
      # tests (mic speech is discarded, never sent) skip, so fetch them here; the
      # model is sha256-checked by fetch_model.py on every run, cached or not.
      - name: Cache YAMNet model and test recordings
        uses: actions/cache@v4
        with:
          path: |
            server/models/
            server/.testdata/
          key: server-testdata-${{ hashFiles('server/tools/fetch_model.py', 'server/tools/fetch_testdata.py') }}

      - name: Fetch YAMNet model and test recordings
        working-directory: server
        run: |
          python tools/fetch_model.py
          python tools/fetch_testdata.py

      - name: Run pytest (no skips allowed)
        working-directory: server
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee "$RUNNER_TEMP/pytest.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::Tests were skipped (model, recordings or g++ missing); speech-discard checks must run in CI"
            exit 1
          fi
