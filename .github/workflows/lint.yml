name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (package-lock.json)
        run: npm ci

      - name: Run ESLint
        run: npx eslint web/js/

  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      # server/ is written in a dense style (one-line guards with ';', long log/format
      # lines, small lambdas), so its pure-style codes are ignored there; pyflakes checks
      # (undefined names, unused imports, ...) stay on everywhere except the two
      # per-file entries, open findings in server/tests to fix and then drop.
      # Same command as `npm run lint:py`.
      - name: Run flake8
        run: |
          flake8 firmware/tools/ server/ --extend-exclude=server/.venv --max-line-length=120 \
            --per-file-ignores="server/*:E501,E702,E731,E741,E127,E301,E303,W391 server/tests/test_e2e.py:E501,E702,E731,E741,E127,E301,E303,W391,F401 server/tests/test_protocol.py:E501,E702,E731,E741,E127,E301,E303,W391,F541"
